<html lang="en">
<head>
<meta charset="utf-8">

<title>English 9 Midterm Review</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,500;0,7..72,700;1,7..72,500&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root {
  /* Layout: header and section tabs, then one practice panel per section; the reading section pairs the passage with its questions side by side on wide screens. */
  --paper: #f3f5f7;
  --surface: #ffffff;
  --ink: #1b2330;
  --muted: #5b6676;
  --accent: #2c5a8c;
  --back: #fbf3e4;
  --line: #d9dee5;
  --accent-ink: #ffffff;
  --good: #1f7a4d;
  --good-bg: #e3f4ea;
  --bad: #b23b3b;
  --bad-bg: #fbe6e6;
  --font-display: "Literata", Georgia, "Times New Roman", serif;
  --font-body: "Source Sans 3", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #12161d; --surface: #1b212b; --ink: #e8ecf1; --muted: #9aa5b4;
    --accent: #7fb0e6; --back: #2a2519; --line: #2f3845; --accent-ink: #0f1620;
    --good: #6fd19c; --good-bg: #173326; --bad: #f08c8c; --bad-bg: #3a1d1d;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #12161d; --surface: #1b212b; --ink: #e8ecf1; --muted: #9aa5b4;
  --accent: #7fb0e6; --back: #2a2519; --line: #2f3845; --accent-ink: #0f1620;
  --good: #6fd19c; --good-bg: #173326; --bad: #f08c8c; --bad-bg: #3a1d1d;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--paper); color: var(--ink); font-family: var(--font-body); font-size: 18px; line-height: 1.5; }
.wrap { max-width: 1040px; margin: 0 auto; padding: 24px 16px 48px; display: grid; gap: 20px; }
header { display: grid; gap: 6px; }
h1 { font-family: var(--font-display); font-weight: 700; font-size: 2rem; line-height: 1.15; margin: 0; text-wrap: balance; }
.sub { color: var(--muted); margin: 0; max-width: 70ch; }
nav { display: flex; flex-wrap: wrap; gap: 8px; }
.tab, .subtab {
  font: inherit; font-size: 0.95rem; font-weight: 600; border: 1px solid var(--line);
  background: var(--surface); color: var(--ink); padding: 8px 14px; border-radius: 999px; cursor: pointer;
  display: inline-flex; gap: 8px; align-items: center;
}
.tab .num { color: var(--muted); font-weight: 700; font-variant-numeric: tabular-nums; }
.tab[aria-selected="true"], .subtab[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.tab[aria-selected="true"] .num { color: inherit; opacity: 0.8; }
button:focus-visible, .card:focus-visible, textarea:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.section-head { display: grid; gap: 4px; }
h2 { font-family: var(--font-display); font-weight: 500; font-size: 1.45rem; margin: 0; }
.section-head p { margin: 0; color: var(--muted); max-width: 70ch; }
.panel { display: grid; gap: 16px; }
.toolbar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; }
.progress { font-size: 0.95rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.score { font-weight: 700; color: var(--ink); }
.box { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 24px; box-shadow: 0 1px 2px rgba(0,0,0,0.04), 0 8px 24px rgba(20,35,60,0.06); }
.kind { font-size: 0.78rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--accent); margin-bottom: 8px; }
.q { font-size: 1.2rem; margin: 0 0 16px; }
.q .sample { font-family: var(--font-display); font-style: italic; }

.choice {
  font: inherit; font-size: 1.05rem; text-align: left; cursor: pointer; width: 100%;
  padding: 10px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--paper); color: var(--ink);
  display: flex; gap: 10px;
}
.choice .letter { font-weight: 700; min-width: 1.4em; }
.choice:hover:not(:disabled) { border-color: var(--accent); }

.choice.correct { background: var(--good-bg); border-color: var(--good); }
.choice.wrong { background: var(--bad-bg); border-color: var(--bad); }
.feedback { margin-top: 14px; padding: 12px 14px; border-radius: 10px; border-left: 4px solid var(--line); background: var(--paper); }
.feedback.good { border-left-color: var(--good); }
.feedback.bad { border-left-color: var(--bad); }
.feedback strong { display: block; margin-bottom: 2px; }
textarea { width: 100%; min-height: 90px; font: inherit; font-size: 1rem; padding: 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--paper); color: var(--ink); resize: vertical; }
label.small { font-size: 0.9rem; color: var(--muted); display: block; margin-bottom: 6px; }
.controls { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
.btn { font: inherit; font-weight: 600; font-size: 1rem; cursor: pointer; padding: 10px 18px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn:disabled { opacity: 0.45; cursor: default; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); }
.seg-label { font-size: 0.9rem; color: var(--muted); margin-right: 8px; }
.seg button { font: inherit; font-size: 0.9rem; border: 0; background: transparent; color: var(--ink); padding: 6px 12px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.stage { perspective: 1400px; }
.card { display: grid; cursor: pointer; transition: transform 0.45s ease; transform-style: preserve-3d; min-height: 300px; }
.card.flipped { transform: rotateY(180deg); }
.face { grid-area: 1 / 1; backface-visibility: hidden; -webkit-backface-visibility: hidden; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 28px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 1px 2px rgba(0,0,0,0.04), 0 8px 24px rgba(20,35,60,0.06); }
.face.back { transform: rotateY(180deg); background: var(--back); }
.face .main { flex: 1; display: grid; align-content: center; font-size: 1.25rem; }
.face .main.big { font-family: var(--font-display); font-size: 2rem; font-weight: 500; text-align: center; text-wrap: balance; }
.hint { font-size: 0.85rem; color: var(--muted); text-align: right; }
.reading { display: grid; gap: 16px; grid-template-columns: 1fr; align-items: start; }
@media (min-width: 900px) { .reading { grid-template-columns: 1.05fr 1fr; } .passage { position: sticky; top: 16px; max-height: calc(100vh - 32px); overflow: auto; } }
.passage { background: var(--back); border: 1px solid var(--line); border-radius: 14px; padding: 22px 24px; }
.passage h3 { font-family: var(--font-display); font-weight: 700; font-size: 1.2rem; margin: 0 0 4px; }
.passage .genre { font-size: 0.85rem; color: var(--muted); margin: 0 0 12px; }
.passage p { font-family: var(--font-display); font-size: 1.05rem; line-height: 1.65; margin: 0 0 12px; max-width: 65ch; }
.passage .pnum { font-family: var(--font-body); font-size: 0.75rem; font-weight: 700; color: var(--muted); margin-right: 6px; }
.subtabs { display: flex; flex-wrap: wrap; gap: 8px; }
.lead { margin: 0 0 12px; color: var(--muted); font-size: 0.98rem; max-width: 70ch; }
.q.sentence { font-family: var(--font-display); background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
.q u { text-decoration-thickness: 2px; text-underline-offset: 3px; }
.subtab .count { font-weight: 700; opacity: 0.7; font-variant-numeric: tabular-nums; }
.match { display: grid; gap: 20px; grid-template-columns: 1fr; }
@media (min-width: 800px) { .match { grid-template-columns: 0.8fr 1.2fr; } }
.match ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.mterms li { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.mterms label { display: flex; align-items: center; gap: 8px; }
.tnum { font-weight: 700; color: var(--muted); min-width: 1.8em; font-variant-numeric: tabular-nums; }
.tname { font-weight: 600; }
select { font: inherit; font-size: 1rem; padding: 4px 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--paper); color: var(--ink); }
select:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.mdefs li { padding: 8px 12px; background: var(--paper); border-radius: 8px; font-size: 0.98rem; }
.dl { font-weight: 700; margin-right: 4px; }
.mark { font-size: 0.85rem; font-weight: 700; padding: 2px 8px; border-radius: 999px; }
.mark.good { color: var(--good); background: var(--good-bg); }
.mark.bad { color: var(--bad); background: var(--bad-bg); }
.keys { text-align: center; font-size: 0.85rem; color: var(--muted); margin: 0; }
@media (prefers-reduced-motion: reduce) { .card { transition: none; } }
@media (max-width: 480px) { h1 { font-size: 1.6rem; } .box, .face { padding: 18px; } .q { font-size: 1.1rem; } .face .main.big { font-size: 1.6rem; } }
</style>

<body>
<div class="wrap">
  <header>
    <h1>English 9 Midterm Review</h1>
    <p class="sub">Practice for Parts 1 to 4 of the midterm, in the same question styles as the exam. Check each answer and read the explanation before moving on. (The essays in Parts 5 and 6 are not included.)</p>
  </header>
  <nav id="tabs" role="tablist" aria-label="Review sections"></nav>
  <section class="section-head">
    <h2 id="section-title"></h2>
    <p id="section-desc"></p>
  </section>
  <div id="view" class="panel"></div>
</div>

<script>
/* ---------- Content ---------- */
const MC = (q, o, a, why) => ({ type: "mc", q, o, a, why });

const GENRES = [
  MC("According to Joseph Campbell, which function of myth inspires awe and gratitude toward the mystery of the universe?", ["Sociological", "Mystical (metaphysical)", "Psychological (pedagogical)", "Cosmological"], 1, "The mystical function awakens awe and gratitude toward the mystery dimension of the universe."),
  MC("A myth explains why the seasons change, linking what farmers see each year to the mystery of the universe. Which function does it serve?", ["Cosmological", "Sociological", "Mystical", "Psychological"], 0, "The cosmological function presents an image of the universe that links local knowledge and experience to its mystery."),
  MC("A myth shows the gods punishing a man who turned away a hungry traveler, teaching the community to welcome strangers. Which function does it serve?", ["Mystical", "Psychological", "Sociological", "Cosmological"], 2, "The sociological function validates and imprints the norms of a society."),
  MC("A myth follows a boy through the trials that make him a man in his tribe. Which function does it serve?", ["Cosmological", "Sociological", "Mystical", "Psychological (pedagogical)"], 3, "The psychological function guides each person through the stages of life within their culture."),
  MC("According to Campbell, what is true of a mythology, taken as a whole, that fails to fulfill all four functions?", ["It has lost its vitality.", "It becomes a fantasy.", "It turns into history.", "It must be rewritten."], 0, "Not every single myth serves all four functions, but a mythology as a whole that fails to do so has lost its vitality."),
  MC("Which is the best definition of an archetype?", ["A character who always wins", "An original model, perfect example, or universal pattern from which other things are copied", "A symbol whose meaning never changes", "A story set in the distant past"], 1, "Archetypes are universal patterns that appear across cultures and time periods."),
  MC("An old hermit gives the young hero a map, a warning, and lessons in sword-fighting before the journey begins. Which archetype is the hermit?", ["The Trickster", "The Helper", "The Mentor", "The Threshold Guardian"], 2, "The Mentor is usually older and trains and guides the hero, representing wisdom."),
  MC("A troll refuses to let the hero cross a bridge until he answers three riddles. The troll serves the dark queen. Which archetype is the troll?", ["The Threshold Guardian", "The Villain", "The Scapegoat", "The Innocent"], 0, "The Threshold Guardian is the gatekeeper who tries to block the hero, often the villain's henchman."),
  MC("When the harvest fails, the villagers blame a quiet stranger who had nothing to do with it and drive him out of town. Which archetype is the stranger?", ["The Anti-Hero", "The Trickster", "The Mentor", "The Scapegoat"], 3, "The Scapegoat suffers or is blamed unjustly so that others escape blame."),
  MC("A prince is locked away in a high, isolated stone room as punishment for his pride. Which archetypal setting is this?", ["The Garden", "The Tower", "The Village", "The River"], 1, "The Tower is a high, isolated place of pride, forced separation, or heavy control."),
  MC("A poor orphan who sells matches on the street rises to become the city's wisest judge. Which archetypal plot is this?", ["The Fall", "Death and Rebirth", "Rags to Riches", "Tradition vs. Change"], 2, "Rags to Riches is a rise from poverty or obscurity to power, wealth, or wisdom."),
  MC("Which of these is NOT a subgenre of speculative fiction?", ["Dystopian fiction", "Magical realism", "Alternate history", "Realistic fiction"], 3, "Speculative fiction departs from everyday realism. Realistic fiction stays inside it."),
  MC("Which story is the best example of magical realism?", ["Elves fight a war in an enchanted kingdom.", "In an ordinary fishing village, a woman's tears turn into moths, and she sweeps them out with the morning dust.", "Scientists build a time machine in a laboratory.", "A teenager struggles to make the soccer team."], 1, "Magical realism places magic in a realistic setting and treats it as matter-of-fact."),
  MC("Magical realism combines the observed facts of reality with which tradition?", ["Indigenous Latin American storytelling: myths, legends, and fables with supernatural elements", "Scientific journals", "Medieval knight romances", "Government records"], 0, "Many Latinos grow up hearing these ancient stories, and magical realism blends them with everyday reality."),
  MC("Why did many Latin American artists and authors turn to magical realism after World War II?", ["To celebrate new technology", "To retell Greek myths", "To question absolute truth and criticize cruel regimes in an indirect, surprising way", "To write stories for young children"], 2, "Suffering under dictatorships led people to look for new ways to explain reality and criticize power."),
  MC("What makes science fiction different from fantasy?", ["Science fiction is always set in space.", "Science fiction relies on logic and scientific explanations; fantasy relies on magic that needs no explanation.", "Fantasy is always set in the future.", "There is no difference."], 1, "Plausible scientific details separate science fiction from fantasy."),
  MC("A writer imagines that social media scores decide who gets a job, a home, and a doctor. Which of Neil Gaiman's phrases is the writer using?", ["\"If this goes on...?\"", "\"If only...?\"", "\"What if...?\"", "\"Once upon a time...\""], 0, "\"If this goes on\" takes a current trend and exaggerates it to see where it leads."),
  MC("A story begins: one morning, the sun simply fails to rise. Which of Gaiman's phrases best fits this premise?", ["\"If this goes on...?\"", "\"If only...?\"", "\"What if...?\"", "\"Happily ever after\""], 2, "\"What if\" creates a sudden departure from our current reality."),
  MC("The Hitchhiker's Guide to the Galaxy first began as what?", ["A comic book", "A BBC radio comedy series", "A silent film", "A newspaper column"], 1, "Douglas Adams's story began as a BBC radio comedy in 1978 before it became a series of novels."),
  MC("Which statement about Jules Verne and the submarine is accurate?", ["Verne invented the submarine.", "Submarines did not exist in his time.", "Real submarines were basic; Verne imagined a far more advanced, electricity-powered Nautilus.", "Verne served as a submarine captain."], 2, "Verne expanded on a real invention, and his vision inspired later submarine development."),
  MC("Which is the best definition of historical fiction?", ["A true biography with no invented details", "A story set in a real time and place in the past that blends researched facts with invented characters, dialogue, and scenes", "A story set in the present day", "A story where history turns out differently"], 1, "Historical fiction is grounded in fact and shaped by imagination."),
  MC("Which title from our notes is realistic fiction rather than historical fiction?", ["Number the Stars", "Fever 1793", "Wonder", "The Book Thief"], 2, "Wonder is set in the present day with true-to-life problems; the others are set in real past eras."),
  MC("In historical fiction, which detail may the writer imagine rather than research?", ["The date of a major battle", "The food people ate in that era", "A character's private thoughts", "Which real people lived in the town"], 2, "Thoughts, feelings, exact conversations, and small scenes between known events can be imagined."),
  MC("What is the Golden Rule of historical fiction?", ["Every character must be a real person.", "Imagined details must be plausible and must never contradict the historical record.", "The story must end happily.", "Only primary sources may be used."], 1, "Imagination can fill the silences, but never against the facts."),
  MC("A historical novel set in 1850 shows its characters cooking over a fire, writing with quill pens, and paying in coins of the era. Which element of the genre is this?", ["Authentic details", "Lasting theme", "Layered conflict", "Realistic fiction"], 0, "Authentic details include the food, clothing, tools, money, and speech of the era."),
  MC("Which setting detail would a Gothic writer most likely use to build dread?", ["A sunny farmers' market on a Saturday morning", "A candle sputtering out in a damp, echoing underground vault", "A spaceship's gleaming control room", "A crowded school cafeteria"], 1, "Gothic fiction favors dark, decaying, isolated places that make readers uneasy."),
  MC("Which pair of stories from this term are both Gothic fiction?", ["\"The Tell-Tale Heart\" and \"The Cask of Amontillado\"", "\"A Very Old Man with Enormous Wings\" and \"House Taken Over\"", "The Hitchhiker's Guide to the Galaxy and 20,000 Leagues Under the Sea", "The Odyssey and Number the Stars"], 0, "Both Poe stories use madness, murder, dark settings, and dread."),
  MC("Mary Shelley's Frankenstein is a Gothic novel that is also often called one of the first novels of which genre?", ["Magical realism", "Historical fiction", "Science fiction", "Realistic fiction"], 2, "Victor uses science, not magic, to create life, so the novel blends Gothic horror with science fiction."),
  MC("Why do Gothic writers often withhold information, such as what is behind a locked door?", ["To make the story easier to follow", "To build suspense and let readers imagine the worst", "To give accurate historical facts", "To show that magic is ordinary"], 1, "What readers cannot see is often more frightening than what they can."),
  MC("The narrator of \"The Tell-Tale Heart\" insists he is not mad while describing a murder. Which kind of narrator, common in Gothic fiction, is this?", ["An omniscient narrator", "An unreliable narrator whose mind may be unraveling", "A second-person narrator", "A narrator who is not a character"], 1, "Gothic fiction often explores madness from the inside, so readers cannot fully trust what the narrator says."),
  MC("Both Gothic fiction and magical realism include strange events. What is the key difference?", ["Gothic fiction treats the strange as frightening; magical realism treats it as an ordinary part of life.", "Gothic fiction is always set in the future.", "Magical realism is always frightening.", "There is no difference."], 0, "The characters' reaction to the strange event is the clue: dread in Gothic fiction, calm acceptance in magical realism."),
];

const TERMS = [
  ["Setting", "The time and place in which a story's main narrative occurs, along with the values associated with them."],
  ["First-person point of view", "The narrator is a character in the story (I, me, my) and knows events only from their own perspective."],
  ["Second-person point of view", "The narrator addresses the reader directly (you, your), making the reader a participant in the story."],
  ["Third-person limited point of view", "The narrator uses he, she, or they and knows the thoughts of some, but not all, characters."],
  ["Third-person omniscient point of view", "The narrator uses he, she, or they, is unbound by time or space, and knows all characters' thoughts."],
  ["Protagonist", "The character around whom all of the action takes place; must undergo some major change."],
  ["Antagonist", "The character or force that opposes the protagonist: a person, nature, society, or something within the protagonist."],
  ["Foil", "A character whose contrasting qualities highlight the traits of another character."],
  ["Anti-hero", "A protagonist who lacks the typical heroic qualities of bravery, courage, and morality."],
  ["Stock character", "A flat, stereotypical, easily recognizable character tied to a specific genre."],
  ["Flat character", "A one-dimensional character with only one or two traits."],
  ["Static character", "A character who remains largely the same throughout the story."],
  ["Dynamic character", "A character who changes significantly throughout the story."],
  ["Direct characterization", "The author directly tells the reader what a character is like."],
  ["Indirect characterization", "The author reveals a character through speech, actions, and what other characters say about them."],
  ["Plot", "The author's arrangement of events in a story."],
  ["Exposition", "Details that introduce characters, setting, and other key background information."],
  ["Inciting incident", "The event that starts the story's central problem."],
  ["Rising action", "The additional complications that happen on the way to the climax."],
  ["Climax", "The crisis, defining moment, or decision point for the protagonist."],
  ["Falling action", "Final details and events that serve as the fallout of the climax."],
  ["Resolution", "How the story resolves; an insight, a revelation, or an unresolved or ironic ending."],
  ["Inner conflict", "A struggle that comes from the main character's own feelings, thoughts, fears, or desires."],
  ["External conflict", "A struggle from outside the character: person vs. person, nature, society, or entity."],
  ["The Hero's Journey", "A pattern of separation, initiation, and return: the hero leaves the ordinary world, faces tests, and returns transformed."],
  ["Mood", "The overall atmosphere or emotional feeling the reader experiences."],
  ["Tone", "The author's or narrator's attitude toward the subject, characters, or setting."],
  ["Diction", "The writer's word choice."],
  ["Syntax", "How words and phrases are arranged into sentences, used for emphasis, parallelism, or pacing."],
  ["Imagery", "Language that appeals to the five senses."],
  ["Theme", "The central, underlying message or universal truth of a work, stated as a complete thought."],
  ["Simile", "A comparison of two unlike things using \"like\" or \"as.\""],
  ["Metaphor", "A comparison of two unlike things without \"like\" or \"as\"; it becomes an extended metaphor when sustained."],
  ["Personification", "Giving human characteristics to non-human things."],
  ["Hyperbole", "Excessive exaggeration not meant to be taken literally."],
  ["Paradox", "A statement that seems contradictory but reveals a truth."],
  ["Symbol", "Something or someone that stands for something else."],
  ["Motif", "A repeated image, sound, word, or symbol within a story."],
  ["Allusion", "A reference to something outside the story: historical, literary, religious, or political."],
  ["Foreshadowing", "A hint at something that will happen later, creating suspense."],
  ["Flashback", "An interruption of the story's chronology to show an earlier event."],
  ["Juxtaposition", "Placing two things side by side to highlight contrast or similarity."],
  ["Verbal irony", "A contrast between what is said and what is meant."],
  ["Situational irony", "A contrast between what happens and what is expected to happen."],
  ["Dramatic irony", "When the audience knows something a character does not."],
];

const PASSAGES = [
  {
    id: "gothic", label: "Gothic", title: "The House on Larkspur Hill", genre: "Practice passage: Gothic fiction",
    paras: [
      "No one in Millbrook had lived in the Ashworth house for forty years, and so no one could explain the light. It appeared each night in the highest window, a thin yellow flame that trembled like a held breath. My grandmother called it nonsense. \"Houses don't remember,\" she said, snapping the curtains shut. Yet she never once let me walk home past the iron gate after dark.",
      "On the night she fell ill, I went anyway. The gate groaned as I pushed it open, and the dead hydrangeas along the path rattled their dry heads at me. Fog crawled up from the creek and pooled around my ankles. I told myself I only wanted to prove her wrong. I told myself I was not afraid.",
      "But when I reached the porch, I saw that the front door, which had been nailed shut for decades, stood open an inch. From somewhere deep inside the house came the slow, patient sound of someone sweeping."
    ],
    qs: [
      MC("Why can no one in Millbrook explain the light in the window?", ["The house burned down years ago.", "No one has lived in the house for forty years.", "The light only appears in the daytime.", "The grandmother forbids anyone to talk about it."], 1, "The first sentence connects the mystery to the house sitting empty for forty years."),
      MC("What does the grandmother DO that contradicts what she SAYS?", ["She calls the light nonsense but never lets the narrator walk past the gate after dark.", "She says the house is safe and then moves away.", "She claims she has never seen the light but describes it in detail.", "She tells the narrator to visit the house and then locks the door."], 0, "Her actions reveal a fear her words deny. This is indirect characterization."),
      MC("From which point of view is the passage told?", ["Third-person omniscient", "Second person", "First person", "Third-person limited"], 2, "The narrator is a character who uses \"I\" and \"me.\""),
      MC("\"A thin yellow flame that trembled like a held breath\" is an example of which device?", ["Metaphor", "Simile", "Hyperbole", "Allusion"], 1, "It compares the flame to a held breath using \"like.\""),
      MC("\"The dead hydrangeas along the path rattled their dry heads at me.\" Which device is this?", ["Personification", "Paradox", "Flashback", "Verbal irony"], 0, "The flowers are given heads and a threatening human action."),

/* ---------- State ---------- */
const LETTERS = "ABCDEFGHIJ".split("");
const state = {
  section: 0,
  quiz: {},          // key -> { pos, answers: {idx: originalChoice}, perms: {idx: [..]} }
  cards: { pos: 0, order: TERMS.map((_, i) => i), flipped: false, termFirst: true },
  termsMode: "match",
  match: null,
  passage: 0,
  errFilter: "all",
};
try { const s = localStorage.getItem("eng9-review-termFirst"); if (s !== null) state.cards.termFirst = s === "1"; } catch (e) {}

const $ = (id) => document.getElementById(id);
const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
const fmt = (s) => esc(s).replace(/&lt;br&gt;/g, "<br>").replace(/__(.+?)__/g, "<u>$1</u>");
const shuffled = (arr) => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
function quizState(key) { if (!state.quiz[key]) state.quiz[key] = { pos: 0, answers: {}, perms: {} }; return state.quiz[key]; }

/* ---------- Tabs ---------- */
SECTIONS.forEach((s, i) => {
  const b = document.createElement("button");
  b.className = "tab"; b.type = "button"; b.id = "tab-" + s.id; b.setAttribute("role", "tab");
  b.innerHTML = `<span class="num">${i + 1}</span><span>${s.tab}</span>`;
  b.addEventListener("click", () => { location.hash = s.id; });
  $("tabs").appendChild(b);
});

/* ---------- Quiz renderer ---------- */
function renderQuiz(container, items, key) {
  const qs = quizState(key);
  const item = items[qs.pos];
  const answered = Object.keys(qs.answers).length;
  const correct = Object.entries(qs.answers).filter(([i, c]) => items[i].a === c).length;
  if (!qs.perms[qs.pos]) qs.perms[qs.pos] = item.fixed ? item.o.map((_, k) => k) : shuffled(item.o.map((_, k) => k));
  const perm = qs.perms[qs.pos];
  const chosen = qs.answers[qs.pos];
  const done = chosen !== undefined;
  const btns = perm.map((k, d) => {
    let cls = "choice";
    if (done && k === item.a) cls += " correct";
    if (done && k === chosen && k !== item.a) cls += " wrong";
    return `<button type="button" class="${cls}" data-k="${k}" ${done ? "disabled" : ""}><span class="letter">${LETTERS[d]}.</span><span>${fmt(item.o[k])}</span></button>`;
  }).join("");
  let fb = "";
  if (done) {
    const ok = chosen === item.a;
    fb = `<div class="feedback ${ok ? "good" : "bad"}" role="status"><strong>${ok ? "Correct." : "Not quite. The answer is " + LETTERS[perm.indexOf(item.a)] + "."}</strong>${fmt(item.why)}</div>`;
  }
  const kinds = { claim: "Analytical claim", transition: "Transition punctuation", quote: "Quote integration", commentary: "Commentary" };
  const lead = item.lead ? `<p class="lead">${esc(item.lead)}</p>` : "";
  const qcls = item.cat ? "q sentence" : "q";
  const body = `<div class="kind">${item.cat ? kinds[item.cat] : "Multiple choice"}</div>${lead}<p class="${qcls}">${fmt(item.q)}</p><div class="choices">${btns}</div>${fb}`;
  container.innerHTML = `
    <div class="toolbar">
      <span class="progress">Question ${qs.pos + 1} of ${items.length}</span>
      <span class="progress">Score: <span class="score">${correct} of ${Object.keys(qs.answers).length}</span> answered correctly</span>
    </div>
    <div class="box">${body}</div>
    <div class="controls">
      <button type="button" class="btn" id="qprev" ${qs.pos === 0 ? "disabled" : ""}>Previous</button>
      <button type="button" class="btn primary" id="qnext" ${qs.pos === items.length - 1 ? "disabled" : ""}>Next question</button>
      <button type="button" class="btn" id="qreset">Start over</button>
    </div>`;
  container.querySelectorAll(".choice").forEach((b) => b.addEventListener("click", () => { qs.answers[qs.pos] = Number(b.dataset.k); renderQuiz(container, items, key); }));
  $("qprev").addEventListener("click", () => { qs.pos--; renderQuiz(container, items, key); });
  $("qnext").addEventListener("click", () => { qs.pos++; renderQuiz(container, items, key); });
  $("qreset").addEventListener("click", () => { state.quiz[key] = { pos: 0, answers: {}, perms: {} }; renderQuiz(container, items, key); });
}

/* ---------- Spot the Error ---------- */
function renderErrors(container) {
  const f = state.errFilter;
  const items = f === "all" ? ERRORS : ERRORS.filter((x) => x.cat === f);
  const subtabs = ERROR_FILTERS.map((x) => {
    const n = x.id === "all" ? ERRORS.length : ERRORS.filter((e) => e.cat === x.id).length;
    return `<button type="button" class="subtab" data-f="${x.id}" aria-selected="${x.id === f}">${x.label} <span class="count">${n}</span></button>`;
  }).join("");
  container.innerHTML = `<div class="subtabs" role="tablist" aria-label="Error types">${subtabs}</div><div class="panel" id="eq"></div>`;
  container.querySelectorAll(".subtab").forEach((b) => b.addEventListener("click", () => { state.errFilter = b.dataset.f; renderErrors(container); }));
  renderQuiz($("eq"), items, "errors-" + f);
}

/* ---------- Literary terms: matching + flashcards ---------- */
function newMatchSet() {
  const terms = shuffled(TERMS.map((_, i) => i)).slice(0, 10);
  state.match = { terms, defs: shuffled(terms), answers: {}, checked: false };
}
function renderTerms(container) {
  const mode = state.termsMode;
  container.innerHTML = `
    <div class="toolbar">
      <div><span class="seg-label" id="mode-label">Practice:</span>
        <span class="seg" role="group" aria-labelledby="mode-label">
          <button type="button" id="m-match" aria-pressed="${mode === "match"}">Matching</button>
          <button type="button" id="m-cards" aria-pressed="${mode === "cards"}">Flashcards</button>
        </span></div>
    </div>
    <div class="panel" id="tv"></div>`;
  $("m-match").addEventListener("click", () => { state.termsMode = "match"; renderTerms(container); });
  $("m-cards").addEventListener("click", () => { state.termsMode = "cards"; renderTerms(container); });
  if (mode === "cards") renderCards($("tv")); else renderMatch($("tv"));
}
function renderMatch(container) {
  if (!state.match) newMatchSet();
  const m = state.match;
  const opts = (i) => `<option value="">—</option>` + m.defs.map((_, d) => `<option value="${d}" ${String(m.answers[i]) === String(d) ? "selected" : ""}>${LETTERS[d]}</option>`).join("");
  const rows = m.terms.map((t, i) => {
    let mark = "";
    if (m.checked) {
      const right = m.defs.indexOf(t);
      const ok = Number(m.answers[i]) === right && m.answers[i] !== undefined && m.answers[i] !== "";
      mark = ok ? `<span class="mark good">Correct</span>` : `<span class="mark bad">Answer: ${LETTERS[right]}</span>`;
    }
    return `<li><label><span class="tnum">${i + 1}.</span> <select data-i="${i}" ${m.checked ? "disabled" : ""} aria-label="Definition for ${esc(TERMS[t][0])}">${opts(i)}</select> <span class="tname">${esc(TERMS[t][0])}</span></label>${mark}</li>`;
  }).join("");
  const defs = m.defs.map((t, d) => `<li><span class="dl">${LETTERS[d]}.</span> ${esc(TERMS[t][1])}</li>`).join("");
  let score = "";
  if (m.checked) {
    const n = m.terms.filter((t, i) => m.answers[i] !== undefined && m.answers[i] !== "" && Number(m.answers[i]) === m.defs.indexOf(t)).length;
    score = `<div class="feedback ${n === 10 ? "good" : "bad"}" role="status"><strong>You matched ${n} of 10 correctly.</strong>Review any you missed, then try a new set.</div>`;
  }
  container.innerHTML = `
    <div class="box">
      <div class="kind">Matching</div>
      <p class="lead">Write the letter of the correct definition next to each term. Each letter is used once.</p>
      <div class="match">
        <ol class="mterms">${rows}</ol>
        <ol class="mdefs">${defs}</ol>
      </div>
      ${score}
    </div>
    <div class="controls">
      <button type="button" class="btn primary" id="mcheck" ${m.checked ? "disabled" : ""}>Check answers</button>
      <button type="button" class="btn" id="mretry" ${m.checked ? "" : "disabled"}>Try this set again</button>
      <button type="button" class="btn" id="mnew">New set of 10</button>
    </div>`;
  container.querySelectorAll("select").forEach((s) => s.addEventListener("change", () => { m.answers[s.dataset.i] = s.value; }));
  $("mcheck").addEventListener("click", () => { m.checked = true; renderMatch(container); });
  $("mretry").addEventListener("click", () => { m.checked = false; m.answers = {}; renderMatch(container); });
  $("mnew").addEventListener("click", () => { newMatchSet(); renderMatch(container); });
}

/* ---------- Flashcards ---------- */
function renderCards(container) {
  const c = state.cards;
  const [term, def] = TERMS[c.order[c.pos]];
  const termHtml = `<div class="main big">${esc(term)}</div>`;
  const defHtml = `<div class="main">${esc(def)}</div>`;
  const front = c.termFirst ? `<div class="kind">Term</div>${termHtml}` : `<div class="kind">Definition</div>${defHtml}`;
  const back = c.termFirst ? `<div class="kind">Definition</div>${defHtml}` : `<div class="kind">Term</div>${termHtml}`;
  container.innerHTML = `
    <div class="toolbar">
      <div><span class="seg-label" id="order-label">Show first:</span>
        <span class="seg" role="group" aria-labelledby="order-label">
          <button type="button" id="ord-term" aria-pressed="${c.termFirst}">Term</button>
          <button type="button" id="ord-def" aria-pressed="${!c.termFirst}">Definition</button>
        </span></div>
      <span class="progress">Card ${c.pos + 1} of ${TERMS.length}</span>
    </div>
    <div class="stage"><div class="card${c.flipped ? " flipped" : ""}" id="card" tabindex="0" role="button" aria-label="Flashcard. Click or press Space to flip.">
      <div class="face front">${front}<div class="hint">Click to flip</div></div>
      <div class="face back">${back}<div class="hint">Click to flip back</div></div>
    </div></div>
    <div class="controls">
      <button class="btn" type="button" id="cprev" ${c.pos === 0 ? "disabled" : ""}>Previous</button>
      <button class="btn primary" type="button" id="cflip">Flip card</button>
      <button class="btn" type="button" id="cnext" ${c.pos === TERMS.length - 1 ? "disabled" : ""}>Next</button>
      <button class="btn" type="button" id="cshuffle">Shuffle</button>
      <button class="btn" type="button" id="crestart">Start over</button>
    </div>
    <p class="keys">Keyboard: Space flips the card. Left and right arrows move between cards.</p>`;
  const flip = () => { c.flipped = !c.flipped; $("card").classList.toggle("flipped", c.flipped); };
  const go = (d) => { const p = c.pos + d; if (p < 0 || p >= TERMS.length) return; c.pos = p; c.flipped = false; renderCards(container); };
  $("card").addEventListener("click", flip);
  $("card").addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); flip(); } });
  $("cflip").addEventListener("click", flip);
  $("cprev").addEventListener("click", () => go(-1));
  $("cnext").addEventListener("click", () => go(1));
  $("cshuffle").addEventListener("click", () => { const a = c.order; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } c.pos = 0; c.flipped = false; renderCards(container); });
  $("crestart").addEventListener("click", () => { c.order = TERMS.map((_, i) => i); c.pos = 0; c.flipped = false; renderCards(container); });
  const setOrder = (v) => { c.termFirst = v; c.flipped = false; try { localStorage.setItem("eng9-review-termFirst", v ? "1" : "0"); } catch (e) {} renderCards(container); };
  $("ord-term").addEventListener("click", () => setOrder(true));
  $("ord-def").addEventListener("click", () => setOrder(false));
  cardKeys = { flip, go };
}
let cardKeys = null;
document.addEventListener("keydown", (e) => {
  if (SECTIONS[state.section].kind !== "terms" || state.termsMode !== "cards" || !cardKeys) return;
  const tag = e.target.tagName;
  if (tag === "TEXTAREA" || tag === "SELECT" || (tag === "BUTTON" && e.key === " ")) return;
  if (e.key === " ") { e.preventDefault(); cardKeys.flip(); }
  else if (e.key === "ArrowRight") cardKeys.go(1);
  else if (e.key === "ArrowLeft") cardKeys.go(-1);
});

/* ---------- Reading ---------- */
function renderReading(container) {
  const p = PASSAGES[state.passage];
  const subtabs = PASSAGES.map((x, i) => `<button type="button" class="subtab" data-i="${i}" aria-selected="${i === state.passage}">Passage ${i + 1}: ${x.label}</button>`).join("");
  const paras = p.paras.map((t, i) => `<p><span class="pnum">${i + 1}</span>${esc(t)}</p>`).join("");
  container.innerHTML = `
    <div class="subtabs" role="tablist" aria-label="Practice passages">${subtabs}</div>
    <div class="reading">
      <article class="passage" aria-label="Practice passage">
        <h3>${esc(p.title)}</h3>
        <p class="genre">${esc(p.genre)}</p>
        ${paras}
      </article>
      <div class="panel" id="rq"></div>
    </div>`;
  container.querySelectorAll(".subtab").forEach((b) => b.addEventListener("click", () => { state.passage = Number(b.dataset.i); renderReading(container); }));
  renderQuiz($("rq"), p.qs, "reading-" + p.id);
}

/* ---------- Router ---------- */
function render() {
  const s = SECTIONS[state.section];
  SECTIONS.forEach((x, i) => $("tab-" + x.id).setAttribute("aria-selected", i === state.section ? "true" : "false"));
  $("section-title").textContent = s.title;
  $("section-desc").textContent = s.desc;
  const v = $("view");
  if (s.kind === "quiz") renderQuiz(v, s.items, s.id);
  else if (s.kind === "terms") renderTerms(v);
  else if (s.kind === "errors") renderErrors(v);
  else renderReading(v);
}
function route() {
  const id = location.hash.replace("#", "");
  const i = SECTIONS.findIndex((s) => s.id === id);
  state.section = i >= 0 ? i : 0;
  render();
}
window.addEventListener("hashchange", route);
route();
</script>
</body>
